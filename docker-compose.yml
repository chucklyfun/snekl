services:
  postgres-alpha:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snekl
      POSTGRES_PASSWORD: snekl
      POSTGRES_DB: snekl
    volumes:
      - postgres-alpha-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snekl"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-beta:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snekl
      POSTGRES_PASSWORD: snekl
      POSTGRES_DB: snekl
    volumes:
      - postgres-beta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snekl"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-alpha:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "5001:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Host=postgres-alpha;Port=5432;Database=snekl;Username=snekl;Password=snekl
      Node__Name: Snekl Alpha
      Node__BaseUrl: http://localhost:5001
      Node__Description: Primary federated forum node
    depends_on:
      postgres-alpha:
        condition: service_healthy

  api-beta:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "5002:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Host=postgres-beta;Port=5432;Database=snekl;Username=snekl;Password=snekl
      Node__Name: Snekl Beta
      Node__BaseUrl: http://localhost:5002
      Node__Description: Secondary federated forum node
    depends_on:
      postgres-beta:
        condition: service_healthy

volumes:
  postgres-alpha-data:
  postgres-beta-data:
